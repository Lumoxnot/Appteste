  <!-- Script do Base44 SDK via CDN (ou você pode baixar e referenciar localmente) -->

  <style>
      @keyframes badge-spin {

        animation: badge-spin 1s linear infinite;

          opacity: 0;
          transform: scale(0.95);
        }

          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
</head>
<body>
  <div id="root">
    <div class="min-h-screen bg-background flex items-center justify-center p-4">
      <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary/10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-primary/5 rounded-full blur-3xl"></div>
      </div>
      <div class="relative w-full max-w-2xl">
        <div class="text-center mb-8">
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl gradient-primary glow-primary mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-cpu w-8 h-8 text-white">
              <rect width="16" height="16" x="4" y="4" rx="2"></rect>
              <rect width="6" height="6" x="9" y="9" rx="1"></rect>
              <path d="M15 2v2"></path>
              <path d="M15 20v2"></path>
              <path d="M2 15h2"></path>
              <path d="M2 9h2"></path>
              <path d="M20 15h2"></path>
              <path d="M20 9h2"></path>
              <path d="M9 2v2"></path>
              <path d="M9 20v2"></path>
            </svg>
          </div>
          <h1 class="text-2xl font-bold text-white tracking-tight">DARK CACHE</h1>
          <p class="text-sm text-muted-foreground mt-1">Acompanhe sua ordem de serviço</p>
        </div>
        <div class="rounded-xl border bg-card text-card-foreground shadow glass-card border-border p-6 mb-6">
          <form class="space-y-3" id="os-form">
            <label class="text-sm text-muted-foreground" for="os-input">Digite o número da sua OS</label>
            <div class="flex gap-2">
              <div class="relative flex-1">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-foreground">
                  <circle cx="11" cy="11" r="8"></circle>
                  <path d="m21 21-4.3-4.3"></path>
                </svg>
                <input class="flex w-full rounded-md border px-3 py-1 text-base shadow-sm transition-colors file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50 md:text-sm pl-9 bg-secondary/50 border-border h-11" placeholder="Ex: OS-2025-123456" id="os-input" value="">
              </div>
              <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 [&_svg]:pointer-events-none [&_svg]:size-4 [&_svg]:shrink-0 bg-primary shadow hover:bg-primary/90 h-9 py-2 gradient-primary glow-primary-sm text-white border-0 px-6" type="submit" id="search-button">Buscar</button>
            </div>
          </form>
          <!-- Área para exibir os resultados -->
          <div id="results-area" class="mt-6">
            <!-- Conteúdo dinâmico será inserido aqui -->
          </div>
        </div>
        <p class="text-center text-xs text-muted-foreground mt-8">Dark Cache • Assistência Técnica Especializada</p>
      </div>
    </div>
  </div>

  <!-- Script de rastreamento original (com correção da URL da API) -->
  <script type="module">
   if (window.self === window.top) {
    let lastPath = "";
    function getPageNameFromPath(path) {
      const segments = path.split("/").filter(Boolean);
      return segments[0] || null;
    }
    function trackPageView() {
      const path = window.location.pathname;
      if (path === lastPath) return;
      lastPath = path;
      const pageName = getPageNameFromPath(path) || "home";
      const appId = "6a5e6000f52d90d1feb75b81";
      const platformUrl = "https://app.base44.com"; // Adicionado para correção
      if (!appId) return;
      fetch(`${platformUrl}/api/app-logs/${appId}/log-user-in-app/${pageName}`, { // URL corrigida
        method: "POST",
      }).catch(() => {});
    }
    const originalPushState = history.pushState.bind(history);
    history.pushState = function (...args) {
      originalPushState(...args);
      trackPageView();
    };
    const originalReplaceState = history.replaceState.bind(history);
    history.replaceState = function (...args) {
      originalReplaceState(...args);
      trackPageView();
    };
    window.addEventListener("popstate", trackPageView);
    trackPageView();
  }
  </script>

  <!-- Script principal da funcionalidade de acompanhamento -->
  <script>
    // Inicialize o cliente Base44
    const base44 = Base44.createClient({ // Base44.createClient porque é carregado via CDN
      appId: "6a5e6000f52d90d1feb75b81",
      headers: {
        "api_key": "ce79ff5dd4fe49399e08e75e4c9d81b0"
      }
    });

    // Elementos do DOM
    const osInput = document.getElementById('os-input');
    const osForm = document.getElementById('os-form');
    const searchButton = document.getElementById('search-button');
    const resultsArea = document.getElementById('results-area');

    // Função para formatar datas
    function formatDate(dateString) {
      if (!dateString) return 'N/A';
      try {
        return new Date(dateString).toLocaleDateString('pt-BR');
      } catch (e) {
        return dateString;
      }
    }

    // Função para exibir mensagens de status
    function displayMessage(message, type = 'info') {
      resultsArea.innerHTML = `<p class="text-center mt-4 ${type === 'error' ? 'text-red-500' : 'text-primary'}">${message}</p>`;
    }

    // Função para renderizar os detalhes da OS
    function renderOrdemServico(os) {
      if (!os) {
        resultsArea.innerHTML = '';
        return;
      }

      resultsArea.innerHTML = `
        <div class="p-4 border rounded-md bg-secondary/30 border-border">
          <h2 class="text-xl font-semibold text-white mb-3">Detalhes da Ordem de Serviço: ${os.numero}</h2>
          <p class="text-muted-foreground">
            <span class="font-medium text-white">Cliente:</span> ${os.cliente_nome}
          </p>
          <p class="text-muted-foreground">
            <span class="font-medium text-white">Telefone:</span> ${os.cliente_telefone || 'N/A'}
          </p>
          <p class="text-muted-foreground">
            <span class="font-medium text-white">Equipamento:</span> ${os.equipamento_tipo} - ${os.marca || 'N/A'} ${os.modelo || 'N/A'}
          </p>
          <p class="text-muted-foreground">
            <span class="font-medium text-white">Serial:</span> ${os.serial || 'N/A'}
          </p>
          <p class="text-muted-foreground">
            <span class="font-medium text-white">Status:</span> ${os.status}
          </p>
          <p class="text-muted-foreground">
            <span class="font-medium text-white">Defeito Relatado:</span> ${os.defeito || 'N/A'}
          </p>
          ${os.diagnostico ? `<p class="text-muted-foreground"><span class="font-medium text-white">Diagnóstico:</span> ${os.diagnostico}</p>` : ''}
          ${os.acessorios ? `<p class="text-muted-foreground"><span class="font-medium text-white">Acessórios:</span> ${os.acessorios}</p>` : ''}
          ${os.estado_fisico ? `<p class="text-muted-foreground"><span class="font-medium text-white">Estado Físico:</span> ${os.estado_fisico}</p>` : ''}
          ${os.observacoes ? `<p class="text-muted-foreground"><span class="font-medium text-white">Observações:</span> ${os.observacoes}</p>` : ''}
          ${os.servico_nome ? `<p class="text-muted-foreground"><span class="font-medium text-white">Serviço:</span> ${os.servico_nome}</p>` : ''}
          ${os.data_entrada ? `<p class="text-muted-foreground"><span class="font-medium text-white">Data de Entrada:</span> ${formatDate(os.data_entrada)}</p>` : ''}
          ${os.data_previsao ? `<p class="text-muted-foreground"><span class="font-medium text-white">Previsão de Conclusão:</span> ${formatDate(os.data_previsao)}</p>` : ''}
          ${os.data_conclusao ? `<p class="text-muted-foreground"><span class="font-medium text-white">Data de Conclusão:</span> ${formatDate(os.data_conclusao)}</p>` : ''}
          ${os.data_entrega ? `<p class="text-muted-foreground"><span class="font-medium text-white">Data de Entrega:</span> ${formatDate(os.data_entrega)}</p>` : ''}
          ${os.garantia_fim ? `<p class="text-muted-foreground"><span class="font-medium text-white">Garantia até:</span> ${formatDate(os.garantia_fim)}</p>` : ''}
        </div>
      `;
    }

    // Função principal de busca
    async function buscarOS(numero) {
      if (!numero || !numero.trim()) {
        displayMessage('Por favor, digite o número da OS.', 'error');
        renderOrdemServico(null);
        return;
      }

      searchButton.disabled = true;
      osInput.disabled = true;
      displayMessage('Carregando dados da OS...');

      try {
        const results = await base44.entities.OrdemServico.filter({
          numero: { _eq: numero.trim() }
        }, '-created_date', 1); // Pega 1 resultado, ordenado por data de criação

        if (results && results.length > 0) {
          renderOrdemServico(results[0]);
        } else {
          displayMessage('Ordem de Serviço não encontrada ou número inválido.', 'error');
          renderOrdemServico(null);
        }
      } catch (err) {
        console.error('Erro ao buscar Ordem de Serviço:', err);
        displayMessage('Erro ao buscar Ordem de Serviço. Tente novamente.', 'error');
        renderOrdemServico(null);
      } finally {
        searchButton.disabled = false;
        osInput.disabled = false;
      }
    }

    // Event Listener para o formulário
    osForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const numero = osInput.value;
      buscarOS(numero);
    });

    // Lógica para preencher e buscar a OS se o ID estiver na URL (query string)
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const osFromUrl = urlParams.get('os'); // Ex: index.html?os=OS-2025-123456

      if (osFromUrl) {
        osInput.value = osFromUrl;
        buscarOS(osFromUrl);
      }
    });
  </script>
</body>
</html>
